<!-- ============ HERO (video background) ============ -->
<section class="hero" id="hero">
  <video class="hero-video" id="heroVideo" muted loop playsinline autoplay preload="metadata"
         data-src-desktop="assets/video/hero-720.mp4" data-src-mobile="assets/video/hero-360.mp4"></video>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <p class="hero-kicker reveal">Hair Density Hub<span class="hide-sm"> · Skin &amp; Hair Transplant Clinic</span></p>
    <h1 class="hero-title reveal">Hair Transplant<br>in Lucknow</h1>

    <div class="hero-search reveal" role="search">
      <div class="search-pill">
        <input type="text" id="heroSearch" placeholder="How is a hair transplant done..." autocomplete="off" aria-label="Search treatments and questions">
        <span class="search-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="#58775C" stroke-width="1.6"/><path d="M16 16l4.5 4.5" stroke="#58775C" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
      </div>
      <ul class="search-results" id="searchResults" role="listbox"></ul>
    </div>

    <div class="hero-actions reveal">
      <button type="button" class="btn btn-gold" data-consult>
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4zM15 16H5V8h10v8z"/></svg>
        Online Consultation
      </button>
      <a href="#" class="btn btn-green js-wa">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 4.6A10.4 10.4 0 0 0 2.9 17.1L1.5 22.5l5.5-1.4a10.4 10.4 0 0 0 5 1.3c5.7 0 10.4-4.7 10.4-10.4 0-2.8-1.1-5.4-3-7.4zM12 20.6c-1.5 0-3.1-.4-4.4-1.2l-.3-.2-3.3.9.9-3.2-.2-.3a8.6 8.6 0 1 1 7.3 4zm4.7-6.4c-.3-.1-1.5-.8-1.8-.9-.2-.1-.4-.1-.6.1l-.8 1c-.2.2-.3.2-.6.1-.3-.1-1.1-.4-2.1-1.3-.8-.7-1.3-1.5-1.4-1.8-.2-.3 0-.4.1-.5l.4-.5.3-.4v-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 .9-1 2.2s1 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4.1 1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2-.1-.2-.3-.3-.6-.4z"/></svg>
        Quick Appointment
      </a>
    </div>

    <ul class="hero-trust reveal">
      <li><strong>3000+</strong> happy clients</li>
      <li><strong>Natural</strong> results</li>
      <li><strong>Permanent</strong> solutions</li>
    </ul>
  </div>

  <!-- Bottom tab bar like the reference site -->
  {{heroBar}}
</section>
